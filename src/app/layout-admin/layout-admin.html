<div class="layout">
  <!-- Header móvil -->
  <header class="mobile-header" role="banner">
    <button 
  class="hamburger-btn" 
  (click)="toggleMenu()" 
  aria-label="Abrir menú"
  [attr.aria-expanded]="menuAbierto"
  aria-controls="sidebar"
>
  <i class="fas fa-bars" aria-hidden="true"></i>
</button>

    <p class="mobile-username">UniVOAE</p>
  </header>

  <!-- Sidebar -->
  <aside 
    id="sidebar" 
    [class.sidebar]="true" 
    [class.open]="menuAbierto" 
    role="navigation" 
    aria-label="Menú principal"
  >
    <div class="sidebar-header">
      <i class="fas fa-user-shield logo" aria-hidden="true"></i>
      <p class="username">{{ usuarioCorreo }}</p>
      <button 
        class="close-btn" 
        (click)="toggleMenu()" 
        aria-label="Cerrar menú"
      >
        <i class="fas fa-times" aria-hidden="true"></i>
      </button>
    </div>

    <nav class="sidebar-menu">
      <a 
        routerLink="/administrador" 
        class="menu-item" 
        title="Dashboard" 
        (click)="toggleMenu()" 
        aria-current="page"
      >
        <i class="fas fa-tachometer-alt" aria-hidden="true"></i>
        <span class="sr-only">Dashboard</span>
        <span>Dashboard</span>
      </a>
      <a 
        routerLink="/actividades" 
        class="menu-item" 
        title="Actividades" 
        (click)="toggleMenu()"
      >
        <i class="fas fa-users" aria-hidden="true"></i>
        <span class="sr-only">Actividades</span>
        <span>Actividades</span>
      </a>
      <a 
        routerLink="/actividadespasadas" 
        class="menu-item" 
        title="Actividades Pasadas" 
        (click)="toggleMenu()"
      >
        <i class="fas fa-history" aria-hidden="true"></i>
        <span class="sr-only">Actividades Pasadas</span>
        <span>Actividades Pasadas</span>
      </a>
      <a 
        routerLink="/buscarestudiantes" 
        class="menu-item" 
        title="Estudiantes" 
        (click)="toggleMenu()"
      >
        <i class="fas fa-graduation-cap" aria-hidden="true"></i>
        <span class="sr-only">Estudiantes</span>
        <span>Estudiantes</span>
      </a>
      <a 
        routerLink="/solicitudes" 
        class="menu-item" 
        title="Solicitudes" 
        (click)="toggleMenu()"
      >
        <i class="fas fa-check" aria-hidden="true"></i>
        <span class="sr-only">Solicitudes</span>
        <span>Solicitudes</span>
      </a>
      <a 
        routerLink="/registro" 
        class="menu-item" 
        title="Listas" 
        (click)="toggleMenu()"
      >
        <i class="fas fa-file-alt" aria-hidden="true"></i>
        <span class="sr-only">Listas</span>
        <span>Listas</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button 
        (click)="cerrarSesion()" 
        class="btn-logout" 
        title="Cerrar sesión"
      >
        <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </aside>

  <!-- Contenido principal -->
 <main class="main-content" [class.menu-open]="menuAbierto" role="main">
  <router-outlet></router-outlet>
</main>
</div>
