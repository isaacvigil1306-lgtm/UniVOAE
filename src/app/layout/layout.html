<div class="layout">
  <!-- Header móvil / franja PC -->
  <header class="mobile-header" role="banner">
    <button 
  class="hamburger-btn" 
  (click)="toggleMenu()" 
  aria-label="Abrir menú"
  [attr.aria-expanded]="menuAbierto"
  aria-controls="sidebar"
>
  <i class="fas fa-bars" aria-hidden="true"></i>
</button>

    <p class="mobile-username">{{ 'UniVOAE' }}</p>
    <button 
      class="close-btn" 
      (click)="toggleMenu()" 
      aria-label="Cerrar menú"
    >
      <i class="fas fa-times" aria-hidden="true"></i>
    </button>
  </header>

  <!-- Sidebar -->
  <aside 
    id="sidebar" 
    [class.sidebar]="true" 
    [class.open]="menuAbierto" 
    role="navigation" 
    aria-label="Menú principal"
  >
    <div class="sidebar-header">
      <i class="fas fa-user-circle logo" aria-hidden="true"></i>
      <p class="username">{{ estudiante || 'UniVOAE' }}</p>
      <button 
        class="close-btn" 
        (click)="toggleMenu()" 
        aria-label="Cerrar menú"
      >
        <i class="fas fa-times" aria-hidden="true"></i>
      </button>
    </div>

    <!-- Menú de navegación -->
    <nav class="sidebar-menu">
      <a 
        routerLink="/principal" 
        class="menu-item" 
        title="Inicio" 
        (click)="toggleMenu()"
        aria-current="page"
      >
        <i class="fas fa-home" aria-hidden="true"></i>
        <span class="sr-only">Inicio</span>
        <span>Inicio</span>
      </a>
      <a 
        routerLink="/calendario" 
        class="menu-item" 
        title="Calendario" 
        (click)="toggleMenu()"
      >
        <i class="fas fa-calendar-alt" aria-hidden="true"></i>
        <span class="sr-only">Calendario</span>
        <span>Calendario</span>
      </a>
      <a 
        routerLink="/historial" 
        class="menu-item" 
        title="Historial" 
        (click)="toggleMenu()"
      >
        <i class="fas fa-history" aria-hidden="true"></i>
        <span class="sr-only">Historial</span>
        <span>Historial</span>
      </a>
    </nav>

    <!-- Footer -->
    <div class="sidebar-footer">
      <button 
        (click)="cerrarSesion()" 
        class="btn-logout" 
        title="Cerrar sesión"
      >
        <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </aside>

  <!-- Contenido principal -->
  <main class="main-content" [class.menu-open]="menuAbierto" role="main">
  <router-outlet></router-outlet>
</main>
</div>
