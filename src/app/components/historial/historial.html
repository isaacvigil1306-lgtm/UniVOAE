<main class="contenido" role="main">
  <div class="contenedor">
    <header>
      <h1>Historial de Actividades</h1>
    </header>

    <section class="tabla-historial-wrapper" aria-label="Historial de actividades">
      <table class="tabla-historial" role="table">
        <thead>
          <tr role="row">
            <th role="columnheader" scope="col" title="Nombre de la Actividad">Nombre de la Actividad</th>
            <th role="columnheader" scope="col" title="Fecha de la actividad">Fecha</th>
            <th role="columnheader" scope="col" title="Horas asignadas">Horas</th>
            <th role="columnheader" scope="col" title="Estado de la actividad">Estado</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let actividad of historialActividades" role="row" tabindex="0" 
              [title]="'Actividad: ' + actividad.nombre + ', Fecha: ' + actividad.fecha + ', Horas: ' + actividad.horas + ', Estado: ' + actividad.estado">
            <td role="cell">{{ actividad.nombre }}</td>
            <td role="cell">{{ actividad.fecha }}</td>
            <td role="cell">{{ actividad.horas }}</td>
            <td role="cell">
              <span
                class="estado"
                [ngClass]="{
                  completada: actividad.estado.toLowerCase() === 'completada',
                  noCompletada: actividad.estado.toLowerCase() !== 'completada'
                }"
                [title]="actividad.estado"
              >
                {{ actividad.estado }}
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  </div>
</main>
