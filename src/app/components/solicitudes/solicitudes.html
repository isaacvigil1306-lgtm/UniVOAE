<div class="contenedor" role="main" aria-labelledby="titulo-solicitudes">
  <h2 id="titulo-solicitudes">Solicitudes de Usuarios</h2>

  <table role="table" aria-labelledby="titulo-solicitudes">
    <thead>
      <tr>
        <th scope="col">Correo</th>
        <th scope="col">Nombre</th>
        <th scope="col">Rol solicitado</th>
        <th scope="col">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of usuariosPendientes">
        <td>{{ user.correo }}</td>
        <td>{{ user.nombre }}</td>
        <td>{{ user.rol }}</td>
        <td>
          <button 
  class="btn-usuario" 
  (click)="aprobar(user, 'usuario')" 
  [attr.aria-label]="'Aprobar a ' + user.nombre + ' como usuario'" 
  title="Aprobar como usuario">
  ✅ Usuario
</button>

<button 
  class="btn-admin" 
  (click)="aprobar(user, 'admin')" 
  [attr.aria-label]="'Aprobar a ' + user.nombre + ' como administrador'" 
  title="Aprobar como administrador">
  🛡️ Admin
</button>

        </td>
      </tr>
    </tbody>
  </table>
</div>
